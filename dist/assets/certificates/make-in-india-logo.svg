<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 40 540 185" width="540" height="185">
  <!-- Official Make in India Lion Silhouette with Mechanical Cogs & Gear Workings -->
  <g fill="#0f172a">
    <!-- Mane and Head Silhouette -->
    <path d="M 40,82 C 45,72 55,62 70,58 C 82,55 95,58 108,65 C 118,52 135,46 150,48 C 165,50 178,58 185,70 C 198,62 215,64 225,74 C 235,84 238,98 235,110 C 248,114 256,126 254,140 C 252,154 240,165 226,168 C 220,178 208,185 195,186 C 182,187 170,182 162,174 C 150,182 134,184 120,180 C 108,176 98,168 92,156 C 80,158 68,154 58,145 C 48,135 44,120 48,106 C 42,98 40,90 40,82 Z"/>
    
    <!-- Body Profile -->
    <path d="M 185,75 C 220,70 260,72 295,80 C 330,88 360,102 390,118 C 420,134 445,152 470,168 C 485,178 495,188 505,198 L 475,202 C 455,188 432,172 405,158 C 375,142 342,130 308,122 C 275,115 240,112 205,115 Z"/>
    
    <!-- Forelegs -->
    <path d="M 155,165 L 145,215 L 168,215 L 175,175 Z"/>
    <path d="M 185,160 L 195,215 L 218,215 L 210,162 Z"/>
    
    <!-- Hind Legs -->
    <path d="M 370,145 C 380,165 385,185 390,215 L 412,215 C 410,185 402,160 392,140 Z"/>
    <path d="M 430,160 C 440,175 448,195 452,215 L 474,215 C 468,190 458,168 445,150 Z"/>

    <!-- Tail -->
    <path d="M 460,162 C 485,150 515,142 540,148 C 555,152 565,165 560,178 C 555,188 542,192 530,188 C 522,185 518,176 522,168 C 505,165 485,172 468,182 Z"/>
  </g>

  <!-- Cutout Negative Space Gears & Industrial Markings -->
  <g fill="#ffffff">
    <!-- Central Main Gear -->
    <circle cx="160" cy="115" r="32"/>
    <!-- Gear Teeth Cutouts -->
    <circle cx="160" cy="115" r="38" fill="none" stroke="#ffffff" stroke-width="7" stroke-dasharray="8 6"/>
    <!-- Center Axle -->
    <circle cx="160" cy="115" r="14" fill="#0f172a"/>
    <circle cx="160" cy="115" r="6" fill="#ffffff"/>

    <!-- Secondary Gear in Chest -->
    <circle cx="108" cy="122" r="20"/>
    <circle cx="108" cy="122" r="25" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="6 5"/>
    <circle cx="108" cy="122" r="8" fill="#0f172a"/>

    <!-- Tertiary Gear in Flank -->
    <circle cx="230" cy="125" r="24"/>
    <circle cx="230" cy="125" r="30" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="7 5"/>
    <circle cx="230" cy="125" r="10" fill="#0f172a"/>

    <!-- Rear Gear -->
    <circle cx="340" cy="138" r="18"/>
    <circle cx="340" cy="138" r="22" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="5 4"/>
    <circle cx="340" cy="138" r="7" fill="#0f172a"/>

    <!-- Connecting Rod Cutout -->
    <rect x="135" y="112" width="70" height="6" rx="3" transform="rotate(8 135 112)"/>
  </g>
</svg>
