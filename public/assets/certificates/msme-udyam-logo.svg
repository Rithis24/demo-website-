<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- MSME Govt of India Logo -->
  <circle cx="200" cy="200" r="185" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Tricolor top accent -->
  <path d="M 120 70 Q 200 60 280 70" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <path d="M 130 82 Q 200 74 270 82" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M 120 92 Q 200 84 280 92" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
  
  <text x="200" y="145" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" letter-spacing="2">GOVERNMENT OF INDIA</text>
  
  <!-- MSME Logo Block -->
  <rect x="75" y="165" width="250" height="70" rx="12" fill="#1e3a8a"/>
  <text x="200" y="218" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="4">MSME</text>
  
  <text x="200" y="270" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="2">UDYAM REGISTERED</text>
  <text x="200" y="295" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" letter-spacing="1">MINISTRY OF MSME</text>
  
  <!-- Reg Number Pill -->
  <rect x="95" y="318" width="210" height="26" rx="13" fill="#f1f5f9"/>
  <text x="200" y="335" text-anchor="middle" font-family="'Inter', monospace" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="1">UDYAM-TN-22-0008892</text>
